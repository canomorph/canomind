name: Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: myapp

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            squashfs-tools \
            zstd

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build Linux bundles
        run: npm run tauri build -- --bundles deb,rpm,appimage

      - name: Create Arch package
        shell: bash
        run: |
          set -euo pipefail

          sudo gem install --no-document fpm

          BIN_NAME="$(cargo metadata --no-deps --format-version 1 | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for package in data["packages"]:
              if package["manifest_path"].endswith("/src-tauri/Cargo.toml"):
                  bins = [target["name"] for target in package["targets"] if "bin" in target["kind"]]
                  if bins:
                      print(bins[0])
                      break
          ')"

          if [ -z "$BIN_NAME" ]; then
            echo "Tauri binary adı Cargo metadata içinden bulunamadı."
            exit 1
          fi

          echo "Bulunan binary: ${BIN_NAME}"
          test -f "src-tauri/target/release/${BIN_NAME}"

          mkdir -p package/usr/bin package/usr/share/applications
          install -m 755 "src-tauri/target/release/${BIN_NAME}" \
            "package/usr/bin/${BIN_NAME}"

          cat > "package/usr/share/applications/${APP_NAME}.desktop" <<EOF
          [Desktop Entry]
          Name=${APP_NAME}
          Exec=${BIN_NAME}
          Type=Application
          Terminal=false
          Categories=Utility;
          EOF

          fpm -s dir -t pacman \
            -n "${APP_NAME}" \
            -v "1.0.${GITHUB_RUN_NUMBER}" \
            --architecture x86_64 \
            --description "Tauri application" \
            -p "src-tauri/target/release/bundle/${APP_NAME}-linux-x86_64.pkg.tar.zst" \
            -C package .

      - name: Create Linux tar.gz
        shell: bash
        run: |
          set -euo pipefail

          BIN_NAME="$(cargo metadata --no-deps --format-version 1 | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for package in data["packages"]:
              if package["manifest_path"].endswith("/src-tauri/Cargo.toml"):
                  bins = [target["name"] for target in package["targets"] if "bin" in target["kind"]]
                  if bins:
                      print(bins[0])
                      break
          ')"

          if [ -z "$BIN_NAME" ]; then
            echo "Tauri binary adı Cargo metadata içinden bulunamadı."
            exit 1
          fi

          test -f "src-tauri/target/release/${BIN_NAME}"
          mkdir -p release-files

          tar -czf "release-files/${APP_NAME}-linux-x86_64.tar.gz" \
            -C "src-tauri/target/release" "${BIN_NAME}"

      - name: Collect Linux packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files

          find src-tauri/target/release/bundle \
            -type f \( \
              -name '*.deb' -o \
              -name '*.rpm' -o \
              -name '*.AppImage' -o \
              -name '*.pkg.tar.zst' \
            \) \
            -exec cp {} release-files/ \;

          ls -lah release-files

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: release-files/*
          if-no-files-found: error
          retention-days: 7

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build macOS app and DMG
        run: npm run tauri build -- --bundles app,dmg

      - name: Create macOS tar.gz and pkg
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files

          APP_PATH="$(find src-tauri/target/release/bundle/macos \
            -maxdepth 1 -name '*.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "Tauri .app bundle bulunamadı."
            exit 1
          fi

          APP_BASENAME="$(basename "$APP_PATH")"

          tar -czf "release-files/${APP_NAME}-macos.tar.gz" \
            -C "$(dirname "$APP_PATH")" "$APP_BASENAME"

          pkgbuild \
            --identifier "com.example.${APP_NAME}" \
            --version "1.0.${GITHUB_RUN_NUMBER}" \
            --install-location "/Applications" \
            --component "$APP_PATH" \
            "release-files/${APP_NAME}-macos.pkg"

          find src-tauri/target/release/bundle/macos \
            -maxdepth 1 -name '*.dmg' \
            -exec cp {} release-files/ \;

          ls -lah release-files

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: release-files/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs:
      - build-linux
      - build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: release-files/**/*
          generate_release_notes: true
